    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeremy Wood</title>
    <meta name="description" content="Senior Implementation Architect at Supermetrics.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@0.320.0"></script>
    
    <style>
        :root {
            --bg-dark: #1E1D1B; /* Grey 900 */
            --bg-midnight: #25254A; /* Purple 900 */
            --primary: #CFFC78; /* Lime 500 */
            --purple-300: #C2C3FF;
            --purple-100: #E2E2FF;
            --text-main: #FFFFFF;
            --text-muted: #E2E2FF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(132, 134, 254, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, var(--bg-midnight) 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: "Neue Haas Grotesk Text", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            background: rgba(39, 39, 99, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(132, 134, 254, 0.15);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .avatar-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            margin: 0 auto 1.5rem;
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px rgba(207, 252, 120, 0.2);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-family: "Outfit", sans-serif;
            font-weight: 800;
            font-size: 2.2rem;
            margin-bottom: 0.25rem;
            letter-spacing: -0.01em;
        }

        .title {
            color: var(--primary);
            font-family: "Outfit", sans-serif;
            font-weight: 600;
            font-size: 1.05rem;
            margin-bottom: 2rem;
            letter-spacing: 0.02em;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 0.85rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-size: 0.95rem;
        }

        .link-btn:hover {
            border-color: var(--primary);
            background: rgba(207, 252, 120, 0.05);
            transform: translateY(-2px);
        }

        .link-btn i {
            width: 18px;
            height: 18px;
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            <img src="profile.jpg" alt="Jeremy Wood">
        </div>
        <h1>Jeremy Wood</h1>
        <div class="title">Senior Implementation Architect @ Supermetrics</div>
        
        <div class="links-container">
            <a href="mailto:jeremy@jeremywood.digital" class="link-btn">
                <i data-lucide="mail"></i> jeremy@jeremywood.digital
            </a>
            <a href="https://www.linkedin.com/in/jeremy-wood-nc" target="_blank" class="link-btn">
                <i data-lucide="linkedin"></i> LinkedIn Profile
            </a>
            <a href="https://github.com/magcargoj" target="_blank" class="link-btn">
                <i data-lucide="github"></i> GitHub Profile
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
